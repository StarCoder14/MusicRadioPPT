<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임캡슐 라디오</title>
  <!-- 인터넷이 안 되면 이 글꼴 대신 맑은 고딕으로 나옴 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 같은 그림을 여러 번 쓰려고 한 곳에 모아 둠 -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="capsule" viewBox="0 0 64 64">
        <g transform="rotate(-35 32 32)">
          <rect x="8" y="22" width="48" height="20" rx="10" fill="none" stroke="#eef2f7" stroke-width="3"/>
          <path d="M32 23.5 h14 a8.5 8.5 0 0 1 0 17 h-14z" fill="#f4b942"/>
        </g>
        <path d="M46 8 a10 10 0 0 1 10 10" fill="none" stroke="#f4b942" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M46 2 a16 16 0 0 1 16 16" fill="none" stroke="#f4b942" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      </symbol>
    </defs>
  </svg>

  <div id="stage">
    <div id="camera">
      <div id="screen">

        <!-- ===== 배경 애니메이션 ===== -->
        <div id="floor-space"><div id="floor-grid"></div></div>
        <div id="horizon-glow"></div>
        <div id="scan-line"></div>

        <!-- 바닥 물결 -->
        <canvas id="sea-waves" width="1920" height="240"></canvas>

        <!-- ===== HUD 테두리 ===== -->
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>
        <div class="hud-ruler left"></div>
        <div class="hud-ruler right"></div>
        <div class="hud-readout left">
          <div class="signal-bars"><span></span><span></span><span></span><span></span><span></span></div>
          <span>FM 21.26 MHz</span>
        </div>
        <div class="hud-readout right">
          <span>33.51°N 126.54°E · JEJU</span>
          <div class="rec-dot"></div>
        </div>

        <!-- ===== 항상 떠 있는 방송 화면 틀 ===== -->
        <header id="top-bar">
          <div class="station-logo">
            <svg class="capsule-icon"><use href="#capsule"/></svg>
            <div>
              <div class="program-name">타임캡슐 라디오</div>
              <div class="station-name">2126 JEJU FM</div>
            </div>
          </div>
          <div class="top-right">
            <div id="future-clock"></div>
            <div id="on-air-lamp">ON AIR</div>
          </div>
        </header>

        <!-- ===== 대기 화면 ===== -->
        <section class="slide standby" data-on-air="off">
          <svg class="capsule-big"><use href="#capsule"/></svg>
          <div class="eyebrow">2126 JEJU FM</div>
          <h1 class="big-title">타임캡슐 라디오</h1>
          <p class="subtitle">우리가 기억해야 할 과거의 이야기</p>
          <p class="waiting-text">곧 방송이 시작됩니다</p>
        </section>

        <!-- ===== 1. DJ 오프닝 ===== -->
        <!-- 사람이 직접 앞에서 말하는 화면은 일부러 비워 둠. 그래야 라디오처럼 사람한테 눈이 감 -->
        <section class="slide"></section>

        <!-- ===== 2. 사연 소개 (영상) ===== -->
        <section class="slide">
          <div class="media-frame full-video">
            <video src="videos/sayeon.mp4" playsinline preload="auto"></video>
            <div class="missing-note">사연 영상<code>videos/sayeon.mp4</code></div>
          </div>
        </section>

        <!-- ===== 3. 패널토크: 제주칠머리당영등굿 ===== -->
        <!-- 영상이 28초라서 앞뒤로 말로 소개하는 빈 화면을 하나씩 둠 -->
        <section class="slide"></section>

        <section class="slide">
          <div class="media-frame full-video">
            <video src="videos/yeongdeunggut.mp4" playsinline preload="auto"></video>
            <div class="missing-note">제주칠머리당영등굿 영상<code>videos/yeongdeunggut.mp4</code></div>
          </div>
        </section>

        <section class="slide"></section>

        <!-- ④ 왜 기억해야 할까 (패널토크, 직접 말함) -->
        <section class="slide"></section>

        <!-- ⑤ 어떻게 이어갈까 (패널토크, 직접 말함) -->
        <section class="slide"></section>

        <!-- ===== 4. 음악 소개 ===== -->
        <!-- 노래 파일에 앞 2초 페이드 인, 0:52부터 3초 페이드 아웃을 미리 넣어 둠. 화면에 들어와서 스페이스를 눌러야 나옴 -->
        <section class="slide">
          <audio src="videos/music.mp3" preload="auto"></audio>
          <div class="equalizer">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="eyebrow">오늘의 음악</div>
          <h2 class="song-title">바람이 불어오는 곳</h2>
          <p class="song-info">김광석</p>
        </section>

        <!-- ===== 5. 공익광고 ===== -->
        <section class="slide">
          <div class="media-frame full-video">
            <video src="videos/gongik.mp4" playsinline preload="auto"></video>
            <div class="missing-note">공익광고 영상<code>videos/gongik.mp4</code></div>
          </div>
        </section>

        <!-- ===== 6. 협찬 (직접 말함) ===== -->
        <section class="slide"></section>

        <!-- ===== 7. DJ 클로징 (직접 말함) ===== -->
        <!-- 안 보이는 단계 하나를 둠. 마지막 멘트 끝나고 한 번 더 누르면 이게 켜지면서 ON AIR 불이 꺼짐 -->
        <section class="slide">
          <div class="step" data-on-air="off"></div>
        </section>

      </div>
      <div id="glitch-bars"></div>
    </div>

    <div id="on-air-flash"></div>
    <div id="practice-timer"></div>
    <!-- 앞에 있는 파일이 없으면 브라우저가 다음 줄 파일을 찾아 봄. 수노에서 받은 mp3든 게임 바로 녹화한 mp4든 bgm 이름이면 됨 -->
    <audio id="background-music" loop preload="auto">
      <source src="videos/bgm.mp3" type="audio/mpeg">
      <source src="videos/bgm.m4a" type="audio/mp4">
      <source src="videos/bgm.mp4" type="video/mp4">
    </audio>
    <audio id="on-air-sound" src="videos/onair.mp3" preload="auto"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
